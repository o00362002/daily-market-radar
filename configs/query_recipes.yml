version: 0.4
last_updated: 2026-08-21
status: active
purpose: >
  核心五個新聞領域與競品情報投影的固定查詢配方(query recipes)。目的:預設較弱的模型也能照抄執行、
  穩定搜到高品質新聞,不依賴模型自行發明查詢。競品情報新增顧問型 AI 營運產品線，
  只追蹤方法論產品化、可重複部署 Agent／平台與客戶營運 runtime，不追一般觀點報告。
  勞動與消費壓力只保留在 indicator_only_recipes，不建立獨立新聞領域或新聞配額。

usage_rules:
  - 每個核心新聞領域每日至少執行 mainstream 配方 2 條 + edge 配方 2 條;命中不足才啟動 retry。
  - 競品情報依 config/competitor_registry.json 的 group_order 執行直接競品、顧問型 AI 營運產品、相鄰平台、台灣平台、基礎設施與內容配方。
  - 競品身分只從 headline 與 today_delta 等事實欄位辨識；不得使用 taiwan_implication、uncertainties 或 next_watch 反推競品。
  - 有 requires_any 的對象必須同時命中營運關聯詞；一般行銷、CRM、雲端、AI 或顧問公司新聞不得因品牌名 alone 進入競品區。
  - 顧問公司必須同時命中固定產品別名與產品化／部署／營運語境；一般研究、調查、預測、人才消息與一次性專案不列入。
  - 勞動與消費壓力配方只更新固定指標面板，不逐段生成完整新聞；事件若獨立符合其他主領域門檻，才在該主領域輸出一次。
  - 配方先於自由發想:模型自己想的查詢只能作為配方跑完後的補充,且需在 coverage audit 揭露。
  - 台灣缺口配方(taiwan_gap)只在該領域台灣新聞不足時執行,不可跳過直接標「台灣新聞不足」。
  - 配方命中的項目照現有欄位規則記錄(edge_case_discovery output_template);缺資料標 unknown。
  - 新領域的配方住在 domains/<domain_id>/sources.json 的 query_recipes,規則相同。
  - 配方成效走 Source Experiment 迴圈:連續多日零命中或高噪音的配方,記錄後降權或改寫。

recipes:
  ai_agents_workflow:
    mainstream:
      - id: ai_model_release
        query: "AI model release OR update announcement this week"
      - id: ai_agent_enterprise
        query: "AI agent enterprise deployment case study"
      - id: ai_pricing_quota
        query: "AI coding agent pricing OR usage limit OR credits change"
    edge:
      - id: ai_weird_usecase
        query: "weird AI agent use case small business deployment"
      - id: ai_failure_edge
        query: "AI agent failure OR security incident OR abuse edge case"
      - id: ai_local_pilot
        query: "AI workflow automation pilot local company case"
    taiwan_gap:
      - id: ai_tw_adoption
        query: "台灣 AI 導入 企業 案例 site:ithome.com.tw OR site:bnext.com.tw"
      - id: ai_tw_official
        query: "AI 政策 補助 數位發展部 site:cna.com.tw"

  crypto_rwa_agent_payments:
    mainstream:
      - id: crypto_market_flow
        query: "bitcoin ETF flows OR stablecoin supply change this week"
      - id: crypto_regulation
        query: "crypto regulation OR exchange enforcement news"
      - id: rwa_tokenization
        query: "RWA tokenization institutional launch"
    edge:
      - id: crypto_payment_pilot
        query: "stablecoin payment pilot merchant OR remittance adoption"
      - id: depin_deployment
        query: "DePIN real-world deployment city infrastructure"
      - id: agent_crypto_payment
        query: "AI agent crypto payment experiment"
    taiwan_gap:
      - id: crypto_tw_legislative
        query: "虛擬資產 OR VASP OR 穩定幣 立法院 OR 金管會"
        note: 觸發 taiwan_crypto_legislative_trigger 時必跑;先查官方再查社群。
      - id: crypto_tw_media
        query: "台灣 加密 監管 交易所 site:abmedia.io OR site:blocktempo.com"

  retail_consumer_social_fashion:
    mainstream:
      - id: retail_major_move
        query: "retail earnings OR store expansion OR closure major brand this week"
      - id: retail_omo
        query: "omnichannel OR retail media network OR social commerce launch"
      - id: fashion_brand_strategy
        query: "fashion brand strategy shift OR DTC pivot news"
    edge:
      - id: retail_innovation_small
        query: "retail innovation small brand case study pilot"
      - id: store_tech_pilot
        query: "store technology pilot AI shopping assistant OR smart fitting room"
      - id: social_commerce_unusual
        query: "social commerce unusual campaign local market"
    taiwan_gap:
      - id: retail_tw_department
        query: "百貨 OR 商場 OR 展店 OR 撤櫃 site:money.udn.com OR site:ctee.com.tw"
      - id: retail_tw_brand
        query: "台灣 服飾品牌 OR 快閃店 OR 週年慶 新聞"

  global_markets_capital_geopolitics:
    mainstream:
      - id: markets_macro_move
        query: "markets rates dollar gold oil major move this week"
      - id: capital_flows
        query: "fund flows OR ETF flows OR foreign investment shift"
      - id: geopolitics_policy
        query: "geopolitics trade policy supply chain impact markets"
    edge:
      - id: niche_market_stress
        query: "unusual capital flow small market stress signal"
      - id: regional_policy_pilot
        query: "regional policy pilot market impact early signal"
    taiwan_gap:
      - id: markets_tw_official
        query: "台股 OR 匯率 OR 出口 央行 OR 金管會 site:cna.com.tw"

  technology_development:
    mainstream:
      - id: tech_breakthrough
        query: "technology breakthrough robotics OR biotech OR energy OR semiconductor this week"
      - id: semi_supply_chain
        query: "semiconductor supply chain order OR capacity news"
    edge:
      - id: tech_lab_pilot
        query: "unusual technology breakthrough startup lab pilot"
      - id: new_material_trial
        query: "new material battery robotics sensor startup trial"
    taiwan_gap:
      - id: tech_tw_supply
        query: "台灣 半導體 OR 供應鏈 OR PCB 載板 site:technews.tw OR site:digitimes.com"

  competitor_intelligence:
    global_direct_retail_action_systems:
      - id: competitor_storee_quorso
        query: '(STOREE OR Quorso) (retail operations OR AI retail manager OR mission) (action OR follow-up OR outcome OR pricing OR case study)'
      - id: competitor_workjam_hubler
        query: '(WorkJam OR Hubler) (retail OR frontline OR system of execution) (task orchestration OR autonomous AI OR SOP OR outcome OR pricing OR customer)'
    global_consulting_ai_operations:
      - id: competitor_mckinsey_bcg_consulting_ai
        query: '("McKinsey Lilli" OR "McKinsey Retail Agentic AI" OR "BCG Frontline Ops AI" OR "BCG Agentic RGM") (retail OR merchandising OR frontline OR store operations OR pricing OR promotion) (product OR platform OR agent OR deployment OR client OR outcome)'
      - id: competitor_big_four_accenture_operations_ai
        query: '("PwC Commercial Brain" OR "PwC Agentic Front Office" OR "EY Intelligent Operations" OR "Deloitte Zora AI" OR "Accenture Edge" OR "Accenture AI Refinery") (operations OR retail OR supply chain OR frontline OR workflow) (product OR platform OR digital workforce OR deployment OR customer OR outcome)'
      - id: competitor_consulting_productization_discovery
        query: '(McKinsey OR BCG OR PwC OR Deloitte OR Accenture OR Bain OR KPMG) ("consulting as software" OR "agentic operations platform" OR "digital workforce" OR "managed AI service" OR "forward deployed") (retail OR store operations OR merchandising OR inventory OR supply chain) -survey -forecast -hiring'
    global_adjacent_execution_platforms:
      - id: competitor_yoobic_zipline
        query: '(YOOBIC OR "Zipline Retail" OR getzipline.com) (store operations OR frontline OR task OR audit OR copilot) (release OR pricing OR case study)'
      - id: competitor_retailcoach_pipefy
        query: '(retailcoach.io OR "Retail Coach AI" OR "Pipefy Retail") (store operations OR daily action OR photo proof OR process orchestration OR AI agent)'
    taiwan_adjacent_retail_platforms:
      - id: competitor_taiwan_operations_expansion
        query: '(91APP OR SHOPLINE OR FLAPS OR 輔翼科技 OR Claireye OR CYBERBIZ OR WACA OR 艾克特 OR Omnichat) (門市營運 OR 補貨 OR 庫存 OR SOP OR 任務 OR 巡檢 OR 工作流 OR AI Agent)'
      - id: competitor_taiwan_local_proof
        query: '台灣 零售 營運系統 (LINE OR Google Workspace OR POS OR ERP) (導入案例 OR 價格 OR ROI OR 3店 OR 50店)'
    global_enabling_platform_threats:
      - id: competitor_microsoft_workato_execution
        query: '("Copilot Studio" OR "Dynamics 365" OR "Workato Enterprise MCP") (retail operations OR store operations OR frontline task OR approval workflow OR execution layer)'
      - id: competitor_shopify_retail_execution
        query: '(Shopify Sidekick OR Shopify Flow OR Shopify POS) (inventory action OR store operations OR staff task OR replenishment OR retail workflow)'
    social:
      - id: competitor_social_positioning
        query: '門市營運 數據 AI Threads Instagram YouTube LinkedIn'
      - id: competitor_retail_creator
        query: 'retail operations creator consultant AI content trend'
    required_registry_expansion: config/competitor_registry.json
    relevance_gate:
      - 事件必須先命中 registry 的品牌或產品身分，再檢查 requires_any 的營運語境。
      - 顧問公司名稱、一般研究、調查、預測、人才消息或一次性專案不得單獨成立競品事件；需有固定產品、可重複部署或持續營運 runtime 證據。
      - 一般公司財報、廣告、CRM、電商促銷、雲端模型或消費者購物助手新聞，不因品牌名出現而列入。
      - 競品事件至少需影響 Action 生成、派工追蹤、證據覆核、Outcome 回測、SOP 客製、headless 投影或台灣在地導入其中一項。

indicator_only_recipes:
  labor_consumption_pressure:
    mainstream:
      - id: labor_market_shift
        query: "youth unemployment OR white collar layoffs OR wage data this week"
      - id: consumer_pressure
        query: "consumer credit stress OR downgrade spending shift data"
    edge:
      - id: ai_job_change_case
        query: "AI changed job role small company case"
      - id: genz_consumption_case
        query: "Gen Z consumption shift local retail case"
    taiwan_gap:
      - id: labor_tw_official
        query: "台灣 失業率 OR 薪資 OR 消費信心 主計總處 site:cna.com.tw OR site:news.pts.org.tw"
    output: configs/indicator_tracking.yml#labor_consumption_pressure
    consumes_news_slot: false
