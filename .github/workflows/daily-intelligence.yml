name: daily-intelligence

# Weekly production pipeline. Taiwan (UTC+8) target: deployed before 09:00 local.
# GitHub schedule delivery may be delayed; the job captures its Taiwan report date
# once so a long live run cannot cross midnight and fail its own quality gate.
# Relevant main-branch runtime, configuration and web changes also run the full accepted
# production pipeline so merged code does not wait until the next morning to reach Pages.
# A healthy report may deploy without AI analysis; stale or fallback analysis is removed.

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/daily-intelligence.yml"
      - "src/radar/**"
      - "config/**"
      - "configs/**"
      - "web/**"
      - "tools/check_production_quality.py"
      - "schemas/**"
  schedule:
    # Monday 07:00 Asia/Taipei = Sunday 23:00 UTC.
    - cron: "0 23 * * 0"
  workflow_dispatch:
    inputs:
      evaluation_mode:
        description: "deterministic | auto | api-assisted"
        default: "auto"
      analysis_mode:
        description: "deterministic | auto | api-assisted"
        default: "auto"

# Never let a stalled older run block later scheduled runs for days.
# The newest run is the only one that can publish the current Taiwan date.
concurrency:
  group: radar-daily
  cancel-in-progress: true

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  intelligence:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      deployable: ${{ steps.gate.outputs.deployable }}
      status: ${{ steps.gate.outputs.status }}
      analysis_status: ${{ steps.gate.outputs.analysis_status }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: python -m pip install --retries 5 -e ".[dev,ai]"

      - name: Capture Taiwan report date
        id: report_date
        run: echo "value=$(TZ=Asia/Taipei date +%F)" >> "$GITHUB_OUTPUT"

      - name: Restore durable state (radar-state branch; never main)
        run: |
          set -euo pipefail
          mkdir -p data
          if git ls-remote --exit-code --heads origin radar-state >/dev/null 2>&1; then
            git fetch origin radar-state
            git worktree add .state origin/radar-state
            PYTHONPATH=src python -m radar.cli state restore --state-root .state/state --database "$PWD/data/radar.db" || echo "state restore reported no usable state"
          else
            echo "no radar-state branch yet; first run starts empty"
            mkdir -p .state/state
          fi

      - name: Run weekly intelligence
        env:
          RADAR_EVALUATION_MODE: ${{ github.event.inputs.evaluation_mode || vars.RADAR_EVALUATION_MODE || 'auto' }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          OPENAI_MAX_DAILY_COST_USD: ${{ vars.OPENAI_MAX_DAILY_COST_USD }}
          OPENAI_MAX_ITEMS_PER_RUN: ${{ vars.OPENAI_MAX_ITEMS_PER_RUN }}
          OPENAI_MAX_INPUT_TOKENS_PER_RUN: ${{ vars.OPENAI_MAX_INPUT_TOKENS_PER_RUN }}
          FRESHRSS_BASE_URL: ${{ secrets.FRESHRSS_BASE_URL }}
          FRESHRSS_USERNAME: ${{ secrets.FRESHRSS_USERNAME }}
          FRESHRSS_API_PASSWORD: ${{ secrets.FRESHRSS_API_PASSWORD }}
        run: |
          set -euo pipefail
          DATE="${{ steps.report_date.outputs.value }}"
          echo "running for captured Taiwan date $DATE in mode $RADAR_EVALUATION_MODE"
          PYTHONPATH=src python -m radar.cli run-daily --mode live --date "$DATE" \
            --profile full --report-window-days 7 \
            --database "$PWD/data/radar.db" --evaluation-mode "$RADAR_EVALUATION_MODE" \
            --timeout-seconds 20 --per-feed-limit 100 > /tmp/report.json

      - name: Export web artifacts
        run: PYTHONPATH=src python -m radar.cli export-web --out-dir "$PWD" --database "$PWD/data/radar.db" --legacy-reports-dir "$PWD/reports"

      - name: Report quality pre-gate
        id: report_gate
        run: |
          set -euo pipefail
          DATE="${{ steps.report_date.outputs.value }}"
          set +e
          python tools/check_production_quality.py \
            --report artifacts/web/v1/latest.json \
            --expected-date "$DATE" \
            --report-only \
            --output artifacts/production-quality-report.json
          gate_status=$?
          set -e

          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path("artifacts/production-quality-report.json").read_text(encoding="utf-8"))
          for warning in payload.get("warnings", []):
              print(f"::warning title=Production report observation::{warning}")
          for reason in payload.get("reasons", []):
              print(f"::error title=Production report rejected::{reason}")
          PY

          if [ "$gate_status" -eq 0 ]; then
            echo "report_ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "report_ok=false" >> "$GITHUB_OUTPUT"
            echo "::error::Report quality gate rejected this run; previous website remains live."
          fi

      - name: Generate AI interpretation and trend scenarios
        id: analysis
        if: steps.report_gate.outputs.report_ok == 'true'
        continue-on-error: true
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          OPENAI_ANALYSIS_MODEL: ${{ vars.OPENAI_ANALYSIS_MODEL }}
          ANALYSIS_MODE: ${{ github.event.inputs.analysis_mode || vars.RADAR_AI_ANALYSIS_MODE || 'auto' }}
        run: |
          set -euo pipefail
          PYTHONPATH=src python -m radar.analysis.cli \
            --database "$PWD/data/radar.db" \
            --repo-root "$PWD" \
            --output-dir "$PWD/artifacts/web/v1/ai-analysis" \
            --mode "$ANALYSIS_MODE"

      - name: Production deployment gate
        id: gate
        run: |
          set -euo pipefail
          DATE="${{ steps.report_date.outputs.value }}"
          if [ "${{ steps.report_gate.outputs.report_ok }}" != "true" ]; then
            echo "deployable=false" >> "$GITHUB_OUTPUT"
            echo "status=rejected" >> "$GITHUB_OUTPUT"
            echo "analysis_status=not_evaluated" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "${{ steps.analysis.outcome }}" = "success" ] && \
             python tools/check_production_quality.py \
               --report artifacts/web/v1/latest.json \
               --analysis artifacts/web/v1/ai-analysis/latest.json \
               --expected-date "$DATE" \
               --output artifacts/production-quality-gate.json; then
            echo "deployable=true" >> "$GITHUB_OUTPUT"
            echo "status=valid" >> "$GITHUB_OUTPUT"
            echo "analysis_status=valid" >> "$GITHUB_OUTPUT"
          else
            echo "deployable=true" >> "$GITHUB_OUTPUT"
            echo "status=report_only" >> "$GITHUB_OUTPUT"
            echo "analysis_status=unavailable" >> "$GITHUB_OUTPUT"
            echo "::warning::AI analysis is unavailable or failed validation; deploying the healthy report and UI without AIAnalysisV1."
            rm -rf artifacts/web/v1/ai-analysis
            python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("artifacts/web/v1/latest.json").read_text(encoding="utf-8"))
          gate_path = Path("artifacts/production-quality-gate.json")
          reasons = []
          if gate_path.exists():
              reasons = json.loads(gate_path.read_text(encoding="utf-8")).get("reasons", [])
          payload = {
              "status": "report_only",
              "report_id": report.get("run_id"),
              "date": report.get("date"),
              "analysis_available": False,
              "reasons": reasons or ["analysis generation failed or did not produce a production-valid artifact"],
          }
          Path("artifacts/web/v1/analysis-status.json").write_text(
              json.dumps(payload, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY
          fi

      - name: Persist durable state (accepted report runs)
        id: persist_state
        if: steps.gate.outputs.deployable == 'true'
        continue-on-error: true
        run: |
          set -euo pipefail
          git config --global user.name "radar-bot"
          git config --global user.email "radar-bot@users.noreply.github.com"

          # State continuity is important, but a transient branch write must not hold the
          # current healthy website hostage. Rebuild from the newest remote state on each
          # attempt, then surface a warning while allowing Pages deployment to continue.
          persisted=false
          for attempt in 1 2 3; do
            echo "state persistence attempt ${attempt}/3"
            rm -rf .state
            git worktree prune
            if git ls-remote --exit-code --heads origin radar-state >/dev/null 2>&1; then
              git fetch -q origin radar-state
              git worktree add -f .state origin/radar-state
              git -C .state checkout -B radar-state
            else
              root_commit=$(git commit-tree "$(git hash-object -t tree /dev/null)" -m "init radar-state")
              git branch -f radar-state "$root_commit"
              git worktree add -f .state radar-state
            fi
            PYTHONPATH=src python -m radar.cli state pack --database "$PWD/data/radar.db" \
              --state-root .state/state --run-id "${GITHUB_RUN_ID}"
            git -C .state add state
            git -C .state commit -q -m "state: run ${GITHUB_RUN_ID}" || echo "no state change"
            if git -C .state push origin HEAD:radar-state; then
              persisted=true
              break
            fi
            sleep $((attempt * 3))
          done
          test "$persisted" = true

      - name: Warn without blocking deployment when durable state cannot be written
        if: steps.gate.outputs.deployable == 'true' && steps.persist_state.outcome == 'failure'
        run: |
          echo "::warning::Healthy report will still deploy, but radar-state persistence failed after retries. Check Actions write permission or radar-state branch conflicts."

      - name: Write readiness receipt
        if: steps.gate.outputs.deployable == 'true'
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          report = json.loads(Path("artifacts/web/v1/latest.json").read_text(encoding="utf-8"))
          analysis_path = Path("artifacts/web/v1/ai-analysis/latest.json")
          receipt = {
              "generated_at": datetime.now(timezone.utc).isoformat(),
              "workflow_run_id": os.environ.get("GITHUB_RUN_ID"),
              "workflow_sha": os.environ.get("GITHUB_SHA"),
              "report_date": report.get("date"),
              "report_run_id": report.get("run_id"),
              "report_status": report.get("status"),
              "ingestion_mode": report.get("source_audit", {}).get("ingestion_mode"),
              "deployment_status": "accepted",
              "analysis_available": analysis_path.exists(),
              "analysis_status": "${{ steps.gate.outputs.analysis_status }}",
              "state_persistence_status": "${{ steps.persist_state.outcome }}",
          }
          Path("artifacts/readiness-receipt.json").write_text(
              json.dumps(receipt, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Build static site
        if: steps.gate.outputs.deployable == 'true'
        working-directory: web
        env:
          RADAR_ARTIFACTS_DIR: ${{ github.workspace }}/artifacts/web/v1
          PAGES_SITE: https://${{ github.repository_owner }}.github.io
          PAGES_BASE: /${{ github.event.repository.name }}
        run: |
          npm ci
          npm run types:check
          npm run build
          mkdir -p dist/data
          cp -R "$RADAR_ARTIFACTS_DIR/." dist/data/
          cp "$GITHUB_WORKSPACE/artifacts/readiness-receipt.json" dist/data/readiness-receipt.json

      - name: Upload Pages artifact
        if: steps.gate.outputs.deployable == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

      - name: Upload readiness receipt
        if: always() && steps.gate.outputs.deployable == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: readiness-receipt-${{ github.run_id }}
          path: artifacts/readiness-receipt.json
          if-no-files-found: error

      - name: Upload report-only analysis diagnostics
        if: always() && steps.gate.outputs.status == 'report_only'
        uses: actions/upload-artifact@v7
        with:
          name: report-only-production-run-${{ github.run_id }}
          path: |
            artifacts/production-quality-report.json
            artifacts/production-quality-gate.json
            artifacts/web/v1/analysis-status.json
            artifacts/web/v1/latest.json
          if-no-files-found: ignore

      - name: Upload rejected-run diagnostics
        if: always() && steps.gate.outputs.deployable != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: rejected-production-run-${{ github.run_id }}
          path: |
            artifacts/production-quality-report.json
            artifacts/production-quality-gate.json
            artifacts/web/v1/latest.json
            artifacts/web/v1/ai-analysis/latest.json
          if-no-files-found: ignore

      - name: Fail visibly when the report is rejected
        if: always() && steps.gate.outputs.deployable != 'true'
        run: |
          echo "Production report rejected. Previous GitHub Pages version was preserved." >&2
          test -f artifacts/production-quality-report.json && cat artifacts/production-quality-report.json >&2 || true
          exit 1

  deploy:
    needs: intelligence
    if: needs.intelligence.outputs.deployable == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
