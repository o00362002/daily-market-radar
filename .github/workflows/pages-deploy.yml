name: pages-deploy

# Manual redeploy of the latest accepted durable state. Production deployment requires
# a healthy report and a non-fallback AIAnalysisV1 tied to the same report.

on:
  workflow_dispatch:
    inputs:
      analysis_mode:
        description: "auto | api-assisted"
        required: false
        default: "auto"
        type: choice
        options:
          - auto
          - api-assisted

concurrency:
  group: radar-daily
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      deployable: ${{ steps.gate.outputs.deployable }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: python -m pip install -e ".[dev,ai]"

      - name: Restore state and export the latest validated artifacts
        run: |
          mkdir -p data
          if git ls-remote --exit-code --heads origin radar-state >/dev/null 2>&1; then
            git fetch origin radar-state
            git worktree add .state origin/radar-state
            PYTHONPATH=src python -m radar.cli state restore --state-root .state/state --database "$PWD/data/radar.db"
            PYTHONPATH=src python -m radar.cli export-web --out-dir "$PWD" --database "$PWD/data/radar.db" --legacy-reports-dir "$PWD/reports"
          else
            echo "no durable state to deploy"; exit 1
          fi

      - name: Report quality pre-gate
        id: report_gate
        run: |
          if python tools/check_production_quality.py \
            --report artifacts/web/v1/latest.json \
            --report-only \
            --output artifacts/production-quality-report.json; then
            echo "report_ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "report_ok=false" >> "$GITHUB_OUTPUT"
            echo "::error::Stored report failed production quality checks."
          fi

      - name: Generate AI interpretation artifacts
        if: steps.report_gate.outputs.report_ok == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          OPENAI_ANALYSIS_MODEL: ${{ vars.OPENAI_ANALYSIS_MODEL }}
          ANALYSIS_MODE: ${{ github.event.inputs.analysis_mode || vars.RADAR_AI_ANALYSIS_MODE || 'auto' }}
        run: |
          PYTHONPATH=src python -m radar.analysis.cli \
            --database "$PWD/data/radar.db" \
            --repo-root "$PWD" \
            --output-dir "$PWD/artifacts/web/v1/ai-analysis" \
            --mode "$ANALYSIS_MODE"

      - name: Production gate
        id: gate
        run: |
          if python tools/check_production_quality.py \
            --report artifacts/web/v1/latest.json \
            --analysis artifacts/web/v1/ai-analysis/latest.json \
            --output artifacts/production-quality-gate.json; then
            echo "deployable=true" >> "$GITHUB_OUTPUT"
          else
            echo "deployable=false" >> "$GITHUB_OUTPUT"
            echo "::error::Manual deployment rejected; previous website remains live."
          fi

      - name: Build site
        if: steps.gate.outputs.deployable == 'true'
        working-directory: web
        env:
          RADAR_ARTIFACTS_DIR: ${{ github.workspace }}/artifacts/web/v1
          PAGES_SITE: https://${{ github.repository_owner }}.github.io
          PAGES_BASE: /${{ github.event.repository.name }}
        run: |
          npm ci
          npm run types:check
          npm run build
          mkdir -p dist/data
          cp -R "$RADAR_ARTIFACTS_DIR/." dist/data/

      - uses: actions/upload-pages-artifact@v3
        if: steps.gate.outputs.deployable == 'true'
        with:
          path: web/dist  # path-ok: built by the preceding astro build step (gitignored)

      - name: Upload rejected deployment diagnostics
        if: always() && steps.gate.outputs.deployable != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: rejected-pages-deploy-${{ github.run_id }}
          path: |
            artifacts/production-quality-report.json
            artifacts/production-quality-gate.json
            artifacts/web/v1/latest.json
            artifacts/web/v1/ai-analysis/latest.json
          if-no-files-found: ignore

      - name: Fail visibly when deployment is rejected
        if: always() && steps.gate.outputs.deployable != 'true'
        run: |
          test -f artifacts/production-quality-gate.json && cat artifacts/production-quality-gate.json >&2 || true
          exit 1

  deploy:
    needs: build
    if: needs.build.outputs.deployable == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
