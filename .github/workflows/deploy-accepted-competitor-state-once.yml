name: deploy-accepted-competitor-state-once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy-accepted-competitor-state-once.yml"

concurrency:
  group: radar-pages-once
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      deployable: ${{ steps.verify.outputs.deployable }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: python -m pip install -e ".[dev]"

      - name: Restore accepted durable state
        run: |
          set -euo pipefail
          mkdir -p data
          git fetch origin radar-state
          git worktree add .state origin/radar-state
          PYTHONPATH=src python -m radar.cli state verify --state-root .state/state
          PYTHONPATH=src python -m radar.cli state restore \
            --state-root .state/state \
            --database "$PWD/data/radar.db"

      - name: Export accepted web artifacts
        run: |
          PYTHONPATH=src python -m radar.cli export-web \
            --out-dir "$PWD" \
            --database "$PWD/data/radar.db" \
            --legacy-reports-dir "$PWD/reports"

      - name: Verify accepted competitor audit
        id: verify
        run: |
          set -euo pipefail
          DATE=$(TZ=Asia/Taipei date +%F)
          python tools/check_production_quality.py \
            --report artifacts/web/v1/latest.json \
            --expected-date "$DATE" \
            --report-only \
            --output artifacts/accepted-state-quality.json
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("artifacts/web/v1/latest.json").read_text(encoding="utf-8"))
          audit = report["competitor_audit"]
          assert audit["fixed_target_count"] == 21, audit
          assert audit["checked_target_count"] == 21, audit
          assert audit["partial_target_count"] == 0, audit
          assert audit["failed_target_count"] == 0, audit
          print(json.dumps({
              "date": report["date"],
              "run_id": report["run_id"],
              "fixed": audit["fixed_target_count"],
              "checked": audit["checked_target_count"],
              "baseline": audit["baseline_target_count"],
              "updated": audit["updated_target_count"],
              "partial": audit["partial_target_count"],
              "failed": audit["failed_target_count"],
          }, ensure_ascii=False, indent=2))
          PY
          rm -rf artifacts/web/v1/ai-analysis
          echo "deployable=true" >> "$GITHUB_OUTPUT"

      - name: Build static site
        if: steps.verify.outputs.deployable == 'true'
        working-directory: web
        env:
          RADAR_ARTIFACTS_DIR: ${{ github.workspace }}/artifacts/web/v1
          PAGES_SITE: https://${{ github.repository_owner }}.github.io
          PAGES_BASE: /${{ github.event.repository.name }}
        run: |
          npm ci
          npm run types:check
          npm run build
          mkdir -p dist/data
          cp -R "$RADAR_ARTIFACTS_DIR/." dist/data/

      - name: Upload Pages artifact
        if: steps.verify.outputs.deployable == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    if: needs.build.outputs.deployable == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
