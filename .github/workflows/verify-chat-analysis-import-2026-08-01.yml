name: verify-chat-analysis-import-2026-08-01

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/verify-chat-analysis-import-2026-08-01.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: python -m pip install --retries 5 -e ".[dev,ai]"

      - name: Restore validated durable state
        run: |
          set -euo pipefail
          mkdir -p data
          git fetch origin radar-state
          git worktree add .state origin/radar-state
          PYTHONPATH=src python -m radar.cli state restore \
            --state-root .state/state \
            --database "$PWD/data/radar.db"

      - name: Export validated report
        run: |
          PYTHONPATH=src python -m radar.cli export-web \
            --out-dir "$PWD" \
            --database "$PWD/data/radar.db" \
            --legacy-reports-dir "$PWD/reports"

      - name: Validate and materialize ChatGPT AIAnalysisV1
        run: |
          PYTHONPATH=src python -m radar.analysis.import_chat \
            --report "$PWD/artifacts/web/v1/latest.json" \
            --analysis "$PWD/chat-analysis-imports/2026-08-01/AIAnalysisV1.json" \
            --repo-root "$PWD" \
            --output-dir "$PWD/artifacts/web/v1/ai-analysis" \
            --receipt "$PWD/chat-analysis-import-receipt.json" \
            --materialize-analysis
          python - <<'PY'
          import json
          from pathlib import Path
          receipt = json.loads(Path("chat-analysis-import-receipt.json").read_text())
          assert receipt["valid"] is True, receipt
          assert receipt["date"] == "2026-08-01", receipt
          assert receipt["effective_mode"] == "chat-assisted", receipt
          assert receipt["supplemental_evidence_count"] == 5, receipt
          analysis = json.loads(Path("chat-analysis-imports/2026-08-01/AIAnalysisV1.json").read_text())
          assert analysis["translations"], "translations were not materialized"
          assert len(analysis["structural_indicators"]) == 3, analysis["structural_indicators"]
          assert len(analysis["linked_indicators"]) == 6, analysis["linked_indicators"]
          print(json.dumps(receipt, ensure_ascii=False, indent=2))
          PY

      - name: Build analysis Page
        working-directory: web
        env:
          RADAR_ARTIFACTS_DIR: ${{ github.workspace }}/artifacts/web/v1
          PAGES_SITE: https://${{ github.repository_owner }}.github.io
          PAGES_BASE: /${{ github.event.repository.name }}
        run: |
          npm ci
          npm run types:check
          npm run build
          test -f dist/analysis/index.html
          grep -q "缺口補搜證據" dist/analysis/index.html

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verify-chat-analysis-import-2026-08-01
          path: |
            chat-analysis-import-receipt.json
            chat-analysis-imports/2026-08-01/AIAnalysisV1.json
            artifacts/web/v1/ai-analysis/latest.json
            web/dist/analysis/index.html
          if-no-files-found: ignore
