name: verify-potential-dedup-live

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/verify-potential-dedup-live.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev,ai]"

      - name: Restore durable state
        run: |
          set -euo pipefail
          mkdir -p data
          git fetch origin radar-state
          git worktree add .state origin/radar-state
          PYTHONPATH=src python -m radar.cli state restore \
            --state-root .state/state \
            --database "$PWD/data/radar.db"

      - name: Run live deterministic verification without deployment
        env:
          FRESHRSS_BASE_URL: ${{ secrets.FRESHRSS_BASE_URL }}
          FRESHRSS_USERNAME: ${{ secrets.FRESHRSS_USERNAME }}
          FRESHRSS_API_PASSWORD: ${{ secrets.FRESHRSS_API_PASSWORD }}
        run: |
          set -euo pipefail
          DATE=$(TZ=Asia/Taipei date +%F)
          echo "$DATE" > verification-date.txt
          PYTHONPATH=src python -m radar.cli run-daily \
            --mode live \
            --date "$DATE" \
            --database "$PWD/data/radar.db" \
            --evaluation-mode deterministic \
            --timeout-seconds 20 \
            --per-feed-limit 50 \
            > report-stdout.json
          PYTHONPATH=src python -m radar.cli export-web \
            --out-dir "$PWD/verify-output" \
            --database "$PWD/data/radar.db" \
            --legacy-reports-dir "$PWD/reports"

      - name: Evaluate production gate and residual defects
        run: |
          set +e
          DATE=$(cat verification-date.txt)
          python tools/check_production_quality.py \
            --report verify-output/artifacts/web/v1/latest.json \
            --expected-date "$DATE" \
            --report-only \
            --output verification-quality.json
          GATE_EXIT=$?
          set -e
          python - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path

          report = json.loads(Path("verify-output/artifacts/web/v1/latest.json").read_text(encoding="utf-8"))
          quality = json.loads(Path("verification-quality.json").read_text(encoding="utf-8"))
          items = report.get("items", [])
          headlines = [item.get("headline", "") for item in items]
          normalized = [" ".join(headline.lower().split()) for headline in headlines]
          duplicates = sorted(headline for headline, count in Counter(normalized).items() if headline and count > 1)
          geopolitical_false_positive = [
              item for item in items
              if "巴拿馬人成俄烏戰爭缺兵招募對象" in item.get("headline", "")
          ]
          lane_counts = Counter(item.get("report_lane") for item in items)
          summary = {
              "date": report.get("date"),
              "run_id": report.get("run_id"),
              "item_count": len(items),
              "major_count": lane_counts.get("major", 0),
              "potential_count": lane_counts.get("potential", 0),
              "quality_valid": quality["valid"],
              "quality_reasons": quality["reasons"],
              "duplicate_normalized_headlines": duplicates,
              "geopolitical_false_positive_count": len(geopolitical_false_positive),
              "headlines": headlines,
          }
          Path("verification-summary.json").write_text(
              json.dumps(summary, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(summary, ensure_ascii=False, indent=2))
          assert not duplicates, duplicates
          assert not geopolitical_false_positive, geopolitical_false_positive
          assert quality["valid"], quality["reasons"]
          PY
          exit "$GATE_EXIT"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: potential-dedup-live-verification
          path: |
            verification-date.txt
            verification-summary.json
            verification-quality.json
            verify-output/artifacts/web/v1/latest.json
            report-stdout.json
          if-no-files-found: ignore
